<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German drills</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  #cheatsheet-content h1 { font-size: 1.25rem; font-weight: 600; margin-top: 0; }
  #cheatsheet-content h2 { font-size: 1rem; font-weight: 600; margin-top: 1.5rem; }
  #cheatsheet-content table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  #cheatsheet-content th, #cheatsheet-content td { border: 1px solid #e2e8f0; padding: 0.375rem 0.75rem; text-align: left; }
  #cheatsheet-content th { background: #fff; font-weight: 500; }
  #cheatsheet-content p { margin: 0.75rem 0; }
  #cheatsheet-content ul { margin: 0.75rem 0; padding-left: 1.25rem; list-style: disc; }
  #cheatsheet-content strong { font-weight: 600; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
<main class="mx-auto max-w-2xl px-5 py-12">
  <h1 class="text-2xl font-semibold tracking-tight">German drills</h1>

  <section id="loader" class="mt-8">
    <label for="json" class="block text-sm text-slate-600">Paste the exercise JSON.</label>
    <textarea id="json" rows="10" spellcheck="false"
      class="mt-2 w-full rounded-lg border border-slate-300 bg-white p-3 font-mono text-sm focus:border-slate-900 focus:outline-none"></textarea>
    <div class="mt-3 flex items-center gap-4">
      <button id="load" type="button"
        class="rounded-lg bg-slate-900 px-5 py-2 text-sm font-medium text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2">Load</button>
      <p id="error" class="text-sm text-rose-600"></p>
    </div>
  </section>

  <section id="cheatsheet" class="mt-8 hidden">
    <div id="cheatsheet-content" class="rounded-lg border border-slate-200 bg-white p-5 text-sm leading-relaxed text-slate-900"></div>
    <p id="cheatsheet-error" class="mt-3 hidden text-sm text-rose-600"></p>
    <div class="mt-6">
      <button id="start-drills" type="button"
        class="rounded-lg bg-slate-900 px-5 py-2 text-sm font-medium text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2">Start drills</button>
    </div>
  </section>

  <section id="session" class="mt-8 hidden">
    <div id="session-body">
      <div id="app" class="space-y-10"></div>
      <div id="controls" class="mt-12 flex flex-wrap items-center gap-4">
        <p id="page-indicator" class="text-sm text-slate-600"></p>
        <button id="check" type="button"
          class="rounded-lg bg-slate-900 px-6 py-2.5 text-sm font-medium text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2">Check answers</button>
      </div>
    </div>
    <section id="summary" class="hidden space-y-8" aria-live="polite">
      <h2 class="text-xl font-semibold tracking-tight">Session summary</h2>
      <div class="space-y-3">
        <dl id="summary-stats" class="grid gap-3 text-sm sm:grid-cols-3"></dl>
        <p class="text-xs text-slate-500">Select all three cells in the row below, copy, and paste into a spreadsheet.</p>
        <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
          <table id="summary-stats-copy" class="w-full min-w-[20rem] border-collapse font-mono text-sm tabular-nums text-slate-900">
            <tbody>
              <tr>
                <td id="summary-copy-elapsed" class="border border-slate-200 px-3 py-2"></td>
                <td id="summary-copy-pct" class="border border-slate-200 px-3 py-2"></td>
                <td id="summary-copy-completed" class="border border-slate-200 px-3 py-2"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div>
        <h3 class="text-sm font-medium text-slate-700">Mistakes</h3>
        <ul id="summary-mistakes" class="mt-3 space-y-3 text-sm leading-relaxed"></ul>
        <p id="summary-no-mistakes" class="mt-3 hidden text-sm text-slate-600">No mistakes.</p>
      </div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
<script src="js/data.js"></script>
<script src="js/validation.js"></script>
<script src="js/transform.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
